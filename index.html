<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoodBridge – Share food. Reduce waste. Feed hope.</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#287D55;--dg:#174B38;--cream:#F8F7F1;--w:#fff;--o:#F4A261;--mint:#E8F4EC;--tx:#1d2b24;--mu:#5d6d64;--bd:#e1e5dc;--red:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--cream:#101a15;--w:#17241d;--mint:#1d3328;--tx:#e8efe9;--mu:#9bb0a3;--bd:#2a3d33}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:var(--cream);color:var(--tx);line-height:1.5}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;line-height:1.1}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:.6rem 1.1rem;font-weight:600;background:var(--g);color:#fff;transition:background .15s}
.btn:hover{background:var(--dg)}.btn.o{background:var(--o);color:#3a2308}.btn.o:hover{background:#e8934a}
.btn.ghost{background:transparent;color:var(--g);border:1.5px solid var(--g)}.btn.red{background:var(--red)}.btn.sm{padding:.3rem .7rem;font-size:.85rem}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
nav.top{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:1px solid var(--bd)}
nav.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{font-size:1.4rem;font-weight:800;color:var(--dg);display:flex;align-items:center;gap:8px}
:root:not([data-theme=light]) .logo{color:var(--tx)}
.links{display:flex;gap:18px;margin-left:auto;align-items:center}.links a{font-weight:500;color:var(--mu)}.links a:hover{color:var(--g)}
.burger{display:none;margin-left:auto;background:none;border:0;font-size:1.6rem;color:var(--tx)}
@media(max-width:820px){.burger{display:block}.links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--cream);flex-direction:column;padding:16px;border-bottom:1px solid var(--bd);align-items:flex-start}.links.open{display:flex}}
.hero{padding:64px 0 48px}.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:800;color:var(--dg)}:root:not([data-theme=light]) .hero h1{color:var(--tx)}
.hero p{font-size:1.15rem;color:var(--mu);max-width:48ch;margin:18px 0 26px}
.hero .art{background:var(--mint);border-radius:28px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.art div{background:var(--w);border-radius:18px;padding:18px;text-align:center;font-size:2.6rem;box-shadow:0 2px 10px #0001}.art small{display:block;font-size:.8rem;color:var(--mu);font-family:Figtree}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--w);border:1px solid var(--bd);border-radius:16px;padding:18px}.stat b{font-family:'Bricolage Grotesque';font-size:2rem;color:var(--g);display:block}.stat span{color:var(--mu);font-size:.9rem}
section.s{padding:44px 0}section.s h2{font-size:2rem;margin-bottom:6px;color:var(--dg)}:root:not([data-theme=light]) section.s h2{color:var(--tx)}
.sub{color:var(--mu);margin:0 0 22px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}@media(max-width:760px){.steps{grid-template-columns:1fr}}
.step{background:var(--mint);border-radius:18px;padding:22px}.step i{font-style:normal;font-size:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--w);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card .img{height:120px;display:grid;place-items:center;font-size:3.2rem;background:linear-gradient(135deg,var(--mint),#cfe6d8);background-size:cover;background-position:center}
.card .b{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}.card h3{font-size:1.1rem}.card .m{font-size:.85rem;color:var(--mu)}
.card .act{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600}
.available,.approved{background:#d6f0e0;color:#14603c}.reserved,.pending{background:#fde8cf;color:#8a4b0b}.collected{background:#dde6f5;color:#274a86}.rejected,.expired{background:#f8d9d5;color:#8e2a1f}
footer{background:var(--dg);color:#cfe3d7;padding:36px 0;margin-top:40px}footer a{color:#fff;margin-right:14px}
.demo{background:var(--o);color:#3a2308;text-align:center;font-size:.82rem;padding:4px}
.auth{max-width:440px;margin:40px auto;background:var(--w);border:1px solid var(--bd);border-radius:20px;padding:28px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select,textarea{width:100%;padding:.6rem .75rem;border:1.5px solid var(--bd);border-radius:10px;background:var(--cream);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.err{color:var(--red);font-size:.85rem;min-height:1.1em}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}
.side{background:var(--dg);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side a,.side button{color:#cfe3d7;padding:.6rem .8rem;border-radius:10px;font-weight:500;background:none;border:0;text-align:left}
.side a.on,.side a:hover,.side button:hover{background:#ffffff1f;color:#fff}.side small{color:#8fb3a1;padding:0 .8rem 8px}
.main{padding:26px;min-width:0}.main h1{font-size:1.8rem;margin-bottom:4px}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;padding:8px}.side small{display:none}.side a,.side button{white-space:nowrap}}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;margin:16px 0}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tabs button{border:1.5px solid var(--bd);background:var(--w);color:var(--tx);border-radius:99px;padding:.3rem .9rem}.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.box{background:var(--w);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:16px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
.empty{text-align:center;padding:40px;color:var(--mu);background:var(--w);border:1.5px dashed var(--bd);border-radius:18px}
.req{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--w);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:grid;place-items:center;padding:16px}.modal>div{background:var(--w);border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:24px}
#toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--dg);color:#fff;padding:.7rem 1rem;border-radius:12px;box-shadow:0 4px 16px #0004}.toast.e{background:var(--red)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.85rem}.bar i{display:block;height:14px;border-radius:7px;background:var(--g)}.bar span:first-child{width:110px;flex:none}
.cols{display:flex;align-items:flex-end;gap:10px;height:140px}.cols div{flex:1;text-align:center;font-size:.75rem;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.cols i{display:block;background:var(--o);border-radius:6px 6px 0 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.g2{grid-template-columns:1fr}}
.stk{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:10px 0}.stk i{display:block}
</style></head><body>
<div class="demo">Demo mode: all data is fictional and stored only in this browser (localStorage).</div>
<div id="app"></div><div id="toasts"></div>
<script>
const CATS=["Cooked Meals","Fruits","Vegetables","Bakery","Packaged Food","Groceries","Other"];
const EMO={"Cooked Meals":"🍛","Fruits":"🍎","Vegetables":"🥕","Bakery":"🥐","Packaged Food":"📦","Groceries":"🛒","Other":"🍽️"};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10),day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const KEY='foodbridge_demo_v1';let DB,S={};
function seed(){const U=(id,n,e,r,org,loc)=>({uid:id,fullName:n,email:e,password:'demo123',phone:'+91 98100 0000'+id.slice(-1),role:r,organizationName:org,location:loc,createdAt:Date.now()-864e6});
const users=[U('u_admin1','Asha Verma','admin@demo.com','admin','FoodBridge HQ','Delhi'),U('u_don1','Ravi Kapoor','donor@demo.com','donor','Spice Route Kitchen (demo)','Delhi'),U('u_don2','Meera Joshi','meera@demo.com','donor','Golden Crumb Bakery (demo)','Noida'),U('u_don3','Sunrise Hostel Mess','hostel@demo.com','donor','Sunrise Hostel (demo)','Ghaziabad'),U('u_ngo1','Hope Meals Trust','ngo@demo.com','ngo','Hope Meals Trust (demo)','Delhi'),U('u_ngo2','Asha Kiran Shelter','ngo2@demo.com','ngo','Asha Kiran Shelter (demo)','Noida')];
const D=(i,d,t,c,desc,q,u,city,off,time,prep,st,safe,cr)=>({donationId:'d'+i,donorId:d,donorName:users.find(x=>x.uid==d).organizationName,title:t,category:c,description:desc,quantity:q,unit:u,imageUrl:'',pickupAddress:city+' main market (demo)',city,pickupDate:day(off),pickupTime:time,preparationTime:prep,safetyNotes:safe,status:st,createdAt:Date.now()-cr*864e5});
const donations=[D(1,'u_don1','Rice & curry meals','Cooked Meals','Freshly cooked rice, dal and mixed veg curry in sealed boxes.',40,'portions','Delhi',1,'18:00–20:00','2 hours ago','available','Kept above 60°C, consume within 4 hours.',0),D(2,'u_don2','Bread & pastries','Bakery','Unsold loaves, buns and pastries from today.',30,'items','Noida',1,'20:00–21:00','This morning','available','Packed in paper bags, no cream items.',1),D(3,'u_don2','Fresh seasonal fruit','Fruits','Apples and bananas, slightly bruised but fresh.',15,'kg','Noida',2,'10:00–12:00','Yesterday','available','Washed and crated.',2),D(4,'u_don1','Mixed vegetables','Vegetables','Potatoes, onions, tomatoes and spinach.',25,'kg','Delhi',2,'09:00–11:00','Yesterday','available','Stored cool and dry.',2),D(5,'u_don3','Hostel dinner surplus','Cooked Meals','Chapati and paneer sabzi from the mess.',50,'portions','Ghaziabad',0,'21:00–22:00','Tonight','reserved','Packed hot, pickup within 1 hour.',0),D(6,'u_don3','Packaged biscuits & juice','Packaged Food','Sealed packs, best before 3+ months.',60,'packs','Ghaziabad',5,'12:00–16:00','n/a','available','All packs sealed and in date.',3),D(7,'u_don1','Wheat flour & lentils','Groceries','Unopened 5 kg flour bags and 2 kg lentils.',20,'bags','Delhi',-3,'12:00–14:00','n/a','collected','Unopened original packaging.',8)];
const R=(i,d,n,u,q,m,st)=>({requestId:'r'+i,donationId:d,donorId:donations.find(x=>x.donationId==d).donorId,receiverId:u,receiverName:users.find(x=>x.uid==u).organizationName,requestedQuantity:q,message:m,status:st,requestedAt:Date.now()-i*36e5*5,updatedAt:Date.now()-i*36e5*4});
const requests=[R(1,'d5',0,'u_ngo1',50,'We can send a van at 21:15.','approved'),R(2,'d1',0,'u_ngo2',20,'For evening shelter dinner.','pending'),R(3,'d7',0,'u_ngo1',20,'For community kitchen.','collected')];
const activity=[{activityId:uid(),userId:'u_don1',action:'Created donation',donationId:'d1',timestamp:Date.now()-72e5},{activityId:uid(),userId:'u_ngo1',action:'Requested donation',donationId:'d5',timestamp:Date.now()-36e5},{activityId:uid(),userId:'u_ngo1',action:'Marked collected',donationId:'d7',timestamp:Date.now()-5e5}];
return{users,donations,requests,activity}}
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!DB){DB=seed();save()}try{S.me=localStorage.getItem(KEY+'_s')}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const me=()=>DB.users.find(u=>u.uid==S.me),log=(a,d)=>{DB.activity.unshift({activityId:uid(),userId:S.me,action:a,donationId:d||'',timestamp:Date.now()});save()};
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' e':'');t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3200)}
const badge=s=>`<span class="badge ${s}">${s[0].toUpperCase()+s.slice(1)}</span>`;
const isExp=d=>d.pickupDate<day(0)&&d.status=='available';
const effStatus=d=>isExp(d)?'expired':d.status;
const fmt=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const imgStyle=d=>d.imageUrl?`style="background-image:url('${d.imageUrl}')"`:'';
function card(d,actions=true){const u=me();return `<div class="card"><div class="img" ${imgStyle(d)}>${d.imageUrl?'':EMO[d.category]||'🍽️'}</div><div class="b"><div>${badge(effStatus(d))} <span class="m">${esc(d.category)}</span></div><h3>${esc(d.title)}</h3><div class="m">${d.quantity} ${esc(d.unit)} · ${esc(d.city)}<br>Pickup by ${esc(d.pickupDate)}, ${esc(d.pickupTime)}<br>${esc(d.donorName)}</div>${actions?`<div class="act"><button class="btn ghost sm" data-act="view" data-id="${d.donationId}">View details</button><button class="btn sm" data-act="reqform" data-id="${d.donationId}">Request donation</button></div>`:''}</div></div>`}
function nav(){const u=me();return `<nav class="top"><div class="wrap"><a class="logo" href="#/">🌿 FoodBridge</a><button class="burger" data-act="burger" aria-label="Menu">☰</button><div class="links" id="links"><a href="#/">Home</a><a href="#/explore">Explore Donations</a><a href="#/#how">How It Works</a><a href="#/safety">Food Safety</a>${u?`<a href="#/app/dash" class="btn sm">Dashboard</a>`:`<a href="#/login">Login</a><a href="#/register" class="btn sm">Get Started</a>`}</div></div></nav>`}
function foot(){return `<footer><div class="wrap"><div class="logo" style="color:#fff">🌿 FoodBridge</div><p>Share food. Reduce waste. Feed hope.</p><a href="#/">About</a><a href="#/safety">Food safety</a><a href="mailto:hello@foodbridge.demo">hello@foodbridge.demo</a><a href="#/explore">Explore</a><p style="font-size:.85rem">Demo project · Not a real service. Follow us: Instagram · LinkedIn · X</p></div></footer>`}
function stats(){const don=DB.donations,req=DB.requests;return [[don.reduce((a,d)=>a+(d.status=='collected'?+d.quantity:0),0)+1240,'Meals rescued (sample + demo)'],[DB.users.filter(u=>u.role=='donor').length,'Active donors'],[DB.users.filter(u=>u.role=='ngo').length,'NGOs connected'],[req.filter(r=>r.status=='collected').length,'Donations completed']].map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}
function landing(){const feat=DB.donations.filter(d=>effStatus(d)=='available').slice(0,3);return nav()+`<header class="hero"><div class="wrap"><div><h1>Good Food Deserves a Second Chance.</h1><p>Connect surplus food with those who need it. Together, we can reduce waste and make every meal matter.</p><a class="btn" href="#/register?r=donor">Donate Food</a> <a class="btn o" href="#/explore">Find Food</a></div><div class="art"><div>🍛<small>Cooked meals</small></div><div>🥐<small>Bakery</small></div><div>🍎<small>Fruit</small></div><div>🥕<small>Vegetables</small></div></div></div></header>
<div class="wrap"><div class="stats">${stats()}</div></div>
<section class="s" id="how"><div class="wrap"><h2>How it works</h2><p class="sub">Three steps from surplus to supper.</p><div class="steps"><div class="step"><i>📝</i><h3>List surplus food</h3><p>Donors post what they have, how much, and when it can be picked up.</p></div><div class="step"><i>🤝</i><h3>Connect with receivers</h3><p>NGOs search, request a quantity, and donors approve.</p></div><div class="step"><i>🚚</i><h3>Collect and redistribute</h3><p>Receivers collect on time and the donation is marked complete.</p></div></div></div></section>
<section class="s"><div class="wrap"><h2>Featured donations</h2><p class="sub">Available right now (demo data).</p><div class="grid">${feat.map(d=>card(d)).join('')}</div></div></section>
<section class="s"><div class="wrap box"><h2>About FoodBridge</h2><p>Tons of edible food are thrown away every day while people go hungry. FoodBridge gives restaurants, cafes, hostels, stores and individuals one place to list surplus food, and gives NGOs a fast way to find and claim it safely.</p></div></section>`+foot()}
function explore(){const cities=[...new Set(DB.donations.map(d=>d.city))];return nav()+`<div class="wrap" style="padding:28px 0"><h1>Explore donations</h1><p class="sub">Search by food name or location. Log in as an NGO to request.</p>${filterBar(cities)}<div id="list" class="grid"></div></div>`+foot()}
function filterBar(c){return `<div class="filters"><input id="q" placeholder="Search food or location…" data-f aria-label="Search"><select id="fc" data-f><option value="">All categories</option>${CATS.map(x=>`<option>${x}</option>`).join('')}</select><select id="fl" data-f><option value="">All locations</option>${c.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="fd" data-f><option value="">Any deadline</option><option value="0">Today</option><option value="2">Within 2 days</option><option value="7">Within a week</option></select><select id="fs" data-f><option value="date">Soonest pickup</option><option value="new">Newest</option><option value="qty">Largest quantity</option></select></div>`}
function applyFilter(){const q=($('#q')?.value||'').toLowerCase(),c=$('#fc').value,l=$('#fl').value,dl=$('#fd').value,s=$('#fs').value;let r=DB.donations.filter(d=>effStatus(d)=='available'&&(!q||(d.title+d.city+d.pickupAddress).toLowerCase().includes(q))&&(!c||d.category==c)&&(!l||d.city==l)&&(!dl||d.pickupDate<=day(+dl)));r.sort((a,b)=>s=='qty'?b.quantity-a.quantity:s=='new'?b.createdAt-a.createdAt:a.pickupDate.localeCompare(b.pickupDate));$('#list').innerHTML=r.length?r.map(d=>card(d)).join(''):`<div class="empty" style="grid-column:1/-1">No donations match. Try clearing a filter.</div>`}
function authPage(reg){const p=new URLSearchParams(location.hash.split('?')[1]||'');return nav()+`<form class="auth" data-form="${reg?'reg':'login'}" novalidate><h2>${reg?'Create your account':'Welcome back'}</h2>${reg?`<label>Full name</label><input name="fullName"><label>Phone number</label><input name="phone" inputmode="tel"><label>I am a</label><select name="role"><option value="donor" ${p.get('r')=='donor'?'selected':''}>Donor (restaurant, hostel, store, individual)</option><option value="ngo">NGO / Receiver</option></select><label>Organization name (if applicable)</label><input name="organizationName"><label>Location (city)</label><input name="location">`:''}<label>Email</label><input name="email" type="email"><label>Password</label><div style="display:flex;gap:6px"><input name="password" type="password" id="pw"><button type="button" class="btn ghost sm" data-act="showpw">Show</button></div><div class="err" id="err"></div><button class="btn" style="width:100%;margin-top:8px">${reg?'Create account':'Log in'}</button>${reg?`<p class="m">Have an account? <a href="#/login" style="color:var(--g)">Log in</a></p>`:`<p class="m">New here? <a href="#/register" style="color:var(--g)">Get started</a></p><div class="box" style="margin:12px 0 0;font-size:.85rem"><b>Demo logins</b> (password <code>demo123</code>)<br>Donor: donor@demo.com<br>NGO: ngo@demo.com<br>Admin: admin@demo.com<div class="act" style="margin-top:8px;display:flex;gap:6px"><button type="button" class="btn sm ghost" data-act="quick" data-e="donor@demo.com">Donor</button><button type="button" class="btn sm ghost" data-act="quick" data-e="ngo@demo.com">NGO</button><button type="button" class="btn sm ghost" data-act="quick" data-e="admin@demo.com">Admin</button></div></div>`}</form>`+foot()}
function safety(){const b=(t,l)=>`<div class="box"><h3>${t}</h3><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;return nav()+`<div class="wrap" style="padding:28px 0"><h1>Food safety</h1><p class="sub">Only donate food that has been stored and handled safely. If you would not eat it, do not donate it.</p><div class="g2">${b('Safe donation guidelines',['Donate food that is fresh, uncontaminated and within date.','Be honest about ingredients and allergens in the safety notes.','Never donate spoiled, moldy, or partly eaten food.'])}${b('Storage',['Keep hot food above 60°C and cold food below 5°C.','Refrigerate perishables within 2 hours of preparation.','Store dry goods in a cool, dry place.'])}${b('Handling & packaging',['Wash hands and use clean utensils and gloves.','Use sealed, food-grade containers and label with prep time.','Separate cooked from raw food.'])}${b('Pickup reminders',['Set a realistic pickup window and stick to it.','Cooked meals should be consumed within 4 hours.','Expired listings are hidden from receivers automatically.'])}</div><div class="box" style="background:#fde8cf"><b>⚠️ Warning:</b> Spoiled or unsafe food must never be donated. Admins can remove unsafe listings.</div></div>`+foot()}
/* ---- app shell ---- */
const MENU={donor:[['dash','Dashboard'],['add','Add Donation'],['mine','My Donations'],['requests','Requests'],['history','Donation History'],['profile','Profile']],ngo:[['dash','Discover Food'],['requests','My Requests'],['profile','Profile']],admin:[['dash','Overview'],['users','Users'],['donations','Donations'],['requests','Requests'],['activity','Activity'],['profile','Profile']]};
function app(page){const u=me();if(!u){location.hash='#/login';return''}const m=MENU[u.role];if(!m.some(x=>x[0]==page))page='dash';let body='';
const V={donor:{dash:donDash,add:()=>donForm(),mine:donMine,requests:donReqs,history:donHist,profile},ngo:{dash:ngoDash,requests:ngoReqs,profile},admin:{dash:admDash,users:admUsers,donations:admDon,requests:admReqs,activity:admAct,profile}}[u.role];body=V[page]();
return nav()+`<div class="shell"><aside class="side"><small>${esc(u.role.toUpperCase())} · ${esc(u.fullName)}</small>${m.map(x=>`<a class="${x[0]==page?'on':''}" href="#/app/${x[0]}">${x[1]}</a>`).join('')}<button data-act="logout">Logout</button></aside><main class="main">${body}</main></div>`}
const sc=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;
const mineD=()=>DB.donations.filter(d=>d.donorId==S.me);
function donDash(){const m=mineD(),rq=DB.requests.filter(r=>r.donorId==S.me);return `<h1>Hello, ${esc(me().fullName.split(' ')[0])}</h1><p class="sub">Here is how your donations are doing.</p><div class="stats">${sc(m.length,'Total donations')}${sc(m.filter(d=>effStatus(d)=='available').length,'Active donations')}${sc(rq.filter(r=>r.status=='pending').length,'Pending requests')}${sc(rq.filter(r=>r.status=='collected').length,'Completed collections')}</div><div class="act"><a class="btn" href="#/app/add">+ Add donation</a></div>`}
function donForm(d){d=d||{};const v=(k,x='')=>esc(d[k]??x);return `<h1>${d.donationId?'Edit donation':'Add donation'}</h1><p class="sub">Share only food that is safe to eat.</p><form class="box" data-form="don" novalidate><input type="hidden" name="id" value="${v('donationId')}"><label>Food title</label><input name="title" value="${v('title')}"><div class="row"><div><label>Category</label><select name="category">${CATS.map(c=>`<option ${d.category==c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Food image (optional)</label><input type="file" name="img" accept="image/*"></div></div><label>Description</label><textarea name="description" rows="2">${v('description')}</textarea><div class="row"><div><label>Quantity</label><input name="quantity" type="number" min="1" value="${v('quantity')}"></div><div><label>Unit</label><select name="unit">${['portions','kg','items','packs','bags','litres'].map(c=>`<option ${d.unit==c?'selected':''}>${c}</option>`).join('')}</select></div></div><label>Pickup address</label><input name="pickupAddress" value="${v('pickupAddress')}"><div class="row"><div><label>City</label><input name="city" value="${v('city',me().location)}"></div><div><label>Pickup date</label><input name="pickupDate" type="date" min="${day(0)}" value="${v('pickupDate')}"></div></div><div class="row"><div><label>Pickup time window</label><input name="pickupTime" placeholder="18:00–20:00" value="${v('pickupTime')}"></div><div><label>Preparation time</label><input name="preparationTime" placeholder="e.g. 2 hours ago" value="${v('preparationTime')}"></div></div><label>Food safety notes</label><textarea name="safetyNotes" rows="2">${v('safetyNotes')}</textarea><label>Contact details</label><input name="contact" value="${v('contact',me().phone)}"><div class="err" id="err"></div><button class="btn">${d.donationId?'Save changes':'Publish donation'}</button></form>`}
function donMine(){const m=mineD().filter(d=>d.status!='collected');return `<h1>My donations</h1>${m.length?`<div class="grid" style="margin-top:16px">${m.map(d=>card(d,false).replace(/<\/div><\/div>$/,`<div class="act" style="padding:0 16px 14px"><button class="btn ghost sm" data-act="edit" data-id="${d.donationId}">Edit</button><button class="btn red sm" data-act="del" data-id="${d.donationId}">Delete</button></div></div>`)).join('')}</div>`:`<div class="empty">No active donations. <a href="#/app/add" style="color:var(--g)">Add your first one</a>.</div>`}`}
function reqCard(r,role){const d=DB.donations.find(x=>x.donationId==r.donationId)||{title:'(removed)'},rc=DB.users.find(u=>u.uid==r.receiverId),dn=DB.users.find(u=>u.uid==r.donorId);let a='';
if(role=='donor'){if(r.status=='pending')a=`<button class="btn sm" data-act="approve" data-id="${r.requestId}">Approve</button><button class="btn red sm" data-act="reject" data-id="${r.requestId}">Reject</button>`;if(r.status=='approved')a=`<button class="btn o sm" data-act="collect" data-id="${r.requestId}">Mark collected</button>`}
if(role=='ngo'&&r.status=='approved')a=`<button class="btn o sm" data-act="collect" data-id="${r.requestId}">Confirm collection</button>`;
return `<div class="req"><div><b>${esc(d.title)}</b> ${badge(r.status)}<div class="m">Qty requested: ${r.requestedQuantity} ${esc(d.unit||'')} · Requested ${fmt(r.requestedAt)} · Pickup ${esc(d.pickupDate||'-')} ${esc(d.pickupTime||'')}<br>Donor: ${esc(dn?.organizationName)} · Receiver: ${esc(r.receiverName)}${role!='ngo'&&rc?` (${esc(rc.phone)}, ${esc(rc.email)})`:''}${r.message?`<br>“${esc(r.message)}”`:''}</div></div><div class="act" style="display:flex;gap:8px;align-items:center">${a}</div></div>`}
function tabsList(list,role){const f=S.tab||'all',fl=f=='all'?list:list.filter(r=>r.status==f);return `<div class="tabs">${['all','pending','approved','rejected','collected'].map(t=>`<button class="${f==t?'on':''}" data-act="tab" data-t="${t}">${t[0].toUpperCase()+t.slice(1)} (${t=='all'?list.length:list.filter(r=>r.status==t).length})</button>`).join('')}</div>${fl.length?fl.map(r=>reqCard(r,role)).join(''):`<div class="empty">No ${f=='all'?'':f+' '}requests yet.</div>`}`}
const donReqs=()=>`<h1>Requests received</h1>${tabsList(DB.requests.filter(r=>r.donorId==S.me).sort((a,b)=>b.requestedAt-a.requestedAt),'donor')}`;
const ngoReqs=()=>`<h1>My requests</h1><p class="sub">Track pending, approved, rejected and collected.</p>${tabsList(DB.requests.filter(r=>r.receiverId==S.me).sort((a,b)=>b.requestedAt-a.requestedAt),'ngo')}`;
function donHist(){const h=DB.requests.filter(r=>r.donorId==S.me&&r.status=='collected');return `<h1>Donation history</h1>${h.length?h.map(r=>reqCard(r,'x')).join(''):`<div class="empty">Completed collections will appear here.</div>`}`}
function ngoDash(){const c=[...new Set(DB.donations.map(d=>d.city))],mine=DB.requests.filter(r=>r.receiverId==S.me);return `<h1>Welcome, ${esc(me().organizationName||me().fullName)}</h1><p class="sub">Find surplus food near you.</p><div class="stats">${sc(mine.filter(r=>r.status=='pending').length,'Pending requests')}${sc(mine.filter(r=>r.status=='approved').length,'Approved')}${sc(mine.filter(r=>r.status=='collected').length,'Collected')}${sc(DB.donations.filter(d=>effStatus(d)=='available').length,'Available now')}</div>${filterBar(c)}<div id="list" class="grid"></div>`}
function profile(){const u=me();return `<h1>Profile</h1><div class="box"><p><b>${esc(u.fullName)}</b><br>${esc(u.email)}<br>${esc(u.phone)}<br>${esc(u.organizationName)} · ${esc(u.location)}<br>Role: ${esc(u.role)}</p></div>`}
/* admin */
function bars(obj){const mx=Math.max(1,...Object.values(obj));return Object.entries(obj).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/mx*60}%"></i><b>${v}</b></div>`).join('')}
function admDash(){const U=DB.users,D=DB.donations,R=DB.requests,cat={};CATS.forEach(c=>cat[c]=D.filter(d=>d.category==c).length);const st={available:0,reserved:0,collected:0,expired:0};D.forEach(d=>st[effStatus(d)]++);const col={available:'#287D55',reserved:'#F4A261',collected:'#174B38',expired:'#c0392b'};const days=[...Array(7)].map((_,i)=>{const d=day(i-6);return[d.slice(5),D.filter(x=>new Date(x.createdAt).toISOString().slice(0,10)==d).length]});const mx=Math.max(1,...days.map(x=>x[1]));
return `<h1>Admin overview</h1><p class="sub">Platform health at a glance.</p><div class="stats">${sc(U.length,'Total users')}${sc(U.filter(u=>u.role=='donor').length,'Donors')}${sc(U.filter(u=>u.role=='ngo').length,'NGOs')}${sc(D.length,'Total donations')}${sc(st.available,'Available')}${sc(R.filter(r=>r.status=='collected').length,'Completed collections')}${sc(R.filter(r=>r.status=='pending').length,'Pending requests')}${sc(D.filter(d=>d.status=='collected').reduce((a,d)=>a+ +d.quantity,0),'Units rescued')}</div><div class="g2"><div class="box"><h3>Donations by category</h3>${bars(cat)}</div><div class="box"><h3>Status distribution</h3><div class="stk">${Object.entries(st).map(([k,v])=>`<i style="flex:${v};background:${col[k]}" title="${k}"></i>`).join('')}</div>${Object.entries(st).map(([k,v])=>`<span class="m" style="margin-right:12px"><span style="color:${col[k]}">●</span> ${k} ${v}</span>`).join('')}</div></div><div class="box"><h3>Donation activity (new listings, last 7 days)</h3><div class="cols">${days.map(x=>`<div><b>${x[1]}</b><i style="height:${x[1]/mx*100}px;min-height:3px"></i>${x[0]}</div>`).join('')}</div></div>`}
const admUsers=()=>`<h1>Users</h1><div class="box tbl"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Organization</th><th>Location</th></tr>${DB.users.map(u=>`<tr><td>${esc(u.fullName)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${esc(u.organizationName)}</td><td>${esc(u.location)}</td></tr>`).join('')}</table></div>`;
const admDon=()=>`<h1>All donations</h1><div class="box tbl"><table><tr><th>Title</th><th>Donor</th><th>Qty</th><th>Status</th><th></th></tr>${DB.donations.map(d=>`<tr><td>${esc(d.title)}</td><td>${esc(d.donorName)}</td><td>${d.quantity} ${esc(d.unit)}</td><td>${badge(effStatus(d))}</td><td><button class="btn red sm" data-act="del" data-id="${d.donationId}">Remove</button></td></tr>`).join('')||'<tr><td>No donations</td></tr>'}</table></div>`;
const admReqs=()=>`<h1>All requests</h1>${tabsList([...DB.requests].sort((a,b)=>b.requestedAt-a.requestedAt),'admin')}`;
const admAct=()=>`<h1>Platform activity</h1><div class="box tbl"><table><tr><th>When</th><th>User</th><th>Action</th><th>Donation</th></tr>${DB.activity.slice(0,40).map(a=>`<tr><td>${new Date(a.timestamp).toLocaleString()}</td><td>${esc(DB.users.find(u=>u.uid==a.userId)?.fullName||'-')}</td><td>${esc(a.action)}</td><td>${esc(DB.donations.find(d=>d.donationId==a.donationId)?.title||a.donationId||'-')}</td></tr>`).join('')}</table></div>`;
/* modals */
function modal(h){closeM();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div role="dialog" aria-modal="true">${h}</div>`;m.addEventListener('click',e=>{if(e.target==m)closeM()});document.body.append(m)}
const closeM=()=>$('#modal')?.remove();
function detail(id){const d=DB.donations.find(x=>x.donationId==id);modal(`<div class="img card" style="margin-bottom:12px"><div class="img" ${imgStyle(d)}>${d.imageUrl?'':EMO[d.category]}</div></div><h2>${esc(d.title)}</h2><p>${badge(effStatus(d))} ${esc(d.category)}</p><p>${esc(d.description)}</p><p class="m"><b>Quantity:</b> ${d.quantity} ${esc(d.unit)}<br><b>Pickup:</b> ${esc(d.pickupAddress)}, ${esc(d.city)}<br><b>When:</b> ${esc(d.pickupDate)}, ${esc(d.pickupTime)}<br><b>Prepared:</b> ${esc(d.preparationTime)}<br><b>Donor:</b> ${esc(d.donorName)}<br><b>Safety notes:</b> ${esc(d.safetyNotes||'None')}</p><div class="act" style="display:flex;gap:8px"><button class="btn" data-act="reqform" data-id="${id}">Request donation</button><button class="btn ghost" data-act="close">Close</button></div>`)}
function reqForm(id){const u=me();if(!u){toast('Log in as an NGO to request food.',1);location.hash='#/login';closeM();return}if(u.role!='ngo'){toast('Only NGO / Receiver accounts can request donations.',1);return}const d=DB.donations.find(x=>x.donationId==id);modal(`<h2>Request: ${esc(d.title)}</h2><form data-form="req" novalidate><input type="hidden" name="id" value="${id}"><label>Quantity needed (max ${d.quantity} ${esc(d.unit)})</label><input name="qty" type="number" min="1" max="${d.quantity}" value="${d.quantity}"><label>Short message</label><textarea name="message" rows="3" placeholder="When can you collect? How will the food be used?"></textarea><div class="err" id="rerr"></div><div class="act" style="display:flex;gap:8px;margin-top:8px"><button class="btn">Send request</button><button type="button" class="btn ghost" data-act="close">Cancel</button></div></form>`)}
/* router */
function render(){const h=location.hash.replace(/^#/,'')||'/',[path]=h.split('?');let html;
if(path=='/explore')html=explore();else if(path=='/safety')html=safety();else if(path=='/login')html=authPage(0);else if(path=='/register')html=authPage(1);else if(path.startsWith('/app/'))html=app(path.slice(5));else html=landing();
$('#app').innerHTML=html;if($('#list')&&$('#fc'))applyFilter();if(path=='/'&&location.hash=='#/#how')$('#how')?.scrollIntoView();else if(!location.hash.includes('#how'))scrollTo(0,0)}
function fail(id,m){$(id).textContent=m;return false}
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const t=f.dataset.form,v=Object.fromEntries(new FormData(f));
if(t=='login'){const u=DB.users.find(x=>x.email.toLowerCase()==(v.email||'').trim().toLowerCase()&&x.password==v.password);if(!v.email||!v.password)return fail('#err','Enter your email and password.');if(!u)return fail('#err','Email or password is incorrect.');S.me=u.uid;try{localStorage.setItem(KEY+'_s',u.uid)}catch(x){}toast('Welcome back, '+u.fullName.split(' ')[0]);location.hash='#/app/dash'}
if(t=='reg'){if(!v.fullName.trim())return fail('#err','Enter your full name.');if(!/^\S+@\S+\.\S+$/.test(v.email))return fail('#err','Enter a valid email address.');if(v.password.length<6)return fail('#err','Password must be at least 6 characters.');if(!/^[+\d][\d\s-]{6,}$/.test(v.phone))return fail('#err','Enter a valid phone number.');if(!v.location.trim())return fail('#err','Enter your city.');if(!['donor','ngo'].includes(v.role))return fail('#err','Choose Donor or NGO.');if(DB.users.some(x=>x.email.toLowerCase()==v.email.toLowerCase()))return fail('#err','That email is already registered. Log in instead.');
const u={uid:'u_'+uid(),fullName:v.fullName.trim(),email:v.email.trim(),password:v.password,phone:v.phone,role:v.role,organizationName:v.organizationName.trim()||v.fullName.trim(),location:v.location.trim(),createdAt:Date.now()};DB.users.push(u);save();S.me=u.uid;try{localStorage.setItem(KEY+'_s',u.uid)}catch(x){}toast('Account created');location.hash='#/app/dash'}
if(t=='don'){const q=+v.quantity;if(!v.title.trim())return fail('#err','Enter a food title.');if(!(q>0))return fail('#err','Quantity must be greater than 0.');if(!v.pickupAddress.trim()||!v.city.trim())return fail('#err','Enter the pickup address and city.');if(!v.pickupDate||v.pickupDate<day(0))return fail('#err','Choose a pickup date from today onward.');if(!v.pickupTime.trim())return fail('#err','Enter a pickup time window.');if(!v.safetyNotes.trim())return fail('#err','Add food safety notes so receivers know how it was stored.');
let img='';const file=f.img.files[0];if(file){if(file.size>400000)return fail('#err','Image is over 400 KB. Choose a smaller one.');img=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)})}
const ex=DB.donations.find(x=>x.donationId==v.id),o={title:v.title.trim(),category:v.category,description:v.description.trim(),quantity:q,unit:v.unit,pickupAddress:v.pickupAddress.trim(),city:v.city.trim(),pickupDate:v.pickupDate,pickupTime:v.pickupTime.trim(),preparationTime:v.preparationTime.trim(),safetyNotes:v.safetyNotes.trim(),contact:v.contact};
if(ex){Object.assign(ex,o);if(img)ex.imageUrl=img;log('Edited donation',ex.donationId);toast('Donation updated')}else{const id='d'+uid();DB.donations.unshift({donationId:id,donorId:S.me,donorName:me().organizationName,imageUrl:img,status:'available',createdAt:Date.now(),...o});log('Created donation',id);toast('Donation published')}save();location.hash='#/app/mine'}
if(t=='req'){const d=DB.donations.find(x=>x.donationId==v.id),q=+v.qty;if(!d||effStatus(d)!='available')return fail('#rerr','This donation is no longer available.');if(!(q>0)||q>d.quantity)return fail('#rerr','Enter a quantity between 1 and '+d.quantity+'.');if(DB.requests.some(r=>r.donationId==d.donationId&&r.receiverId==S.me&&['pending','approved'].includes(r.status)))return fail('#rerr','You already have an active request for this donation.');
DB.requests.unshift({requestId:'r'+uid(),donationId:d.donationId,donorId:d.donorId,receiverId:S.me,receiverName:me().organizationName,requestedQuantity:q,message:v.message.trim(),status:'pending',requestedAt:Date.now(),updatedAt:Date.now()});log('Requested donation',d.donationId);toast('Request sent. Track it under My Requests.');closeM();location.hash='#/app/requests'}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,R=()=>DB.requests.find(r=>r.requestId==id),setR=(s,m,al)=>{const r=R();if(!r)return;if(!me()||!(me().role=='admin'||r.donorId==S.me||r.receiverId==S.me))return toast('Not allowed.',1);r.status=s;r.updatedAt=Date.now();const d=DB.donations.find(x=>x.donationId==r.donationId);if(d&&al)d.status=al;log(m,r.donationId);toast(m);render()};
if(a=='burger')$('#links').classList.toggle('open');if(a=='close')closeM();if(a=='view')detail(id);if(a=='reqform'){closeM();reqForm(id)}
if(a=='showpw'){const p=$('#pw');p.type=p.type=='password'?'text':'password';b.textContent=p.type=='password'?'Show':'Hide'}
if(a=='quick'){const u=DB.users.find(x=>x.email==b.dataset.e);S.me=u.uid;try{localStorage.setItem(KEY+'_s',u.uid)}catch(x){}toast('Logged in as '+u.fullName);location.hash='#/app/dash'}
if(a=='logout'){S.me=null;try{localStorage.removeItem(KEY+'_s')}catch(x){}toast('Logged out');location.hash='#/'}
if(a=='tab'){S.tab=b.dataset.t;render()}
if(a=='approve'){const r=R(),d=DB.donations.find(x=>x.donationId==r?.donationId);if(d&&d.status=='reserved')return toast('Another request is already approved for this donation.',1);setR('approved','Request approved','reserved')}
if(a=='reject')setR('rejected','Request rejected');
if(a=='collect')setR('collected','Marked as collected','collected');
if(a=='edit'){const d=DB.donations.find(x=>x.donationId==id);$('#app').querySelector('.main').innerHTML=donForm(d)}
if(a=='del'&&confirm('Delete this listing? Related requests will be removed.')){const d=DB.donations.find(x=>x.donationId==id);if(!d||!me()||!(me().role=='admin'||d.donorId==S.me))return toast('Not allowed.',1);DB.donations=DB.donations.filter(x=>x.donationId!=id);DB.requests=DB.requests.filter(r=>r.donationId!=id);log('Removed donation',id);toast('Listing removed');render()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-f]'))applyFilter()});
addEventListener('hashchange',render);load();render();
</script></body></html>
